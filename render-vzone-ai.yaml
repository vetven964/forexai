services:
  - type: web
    name: v-zone-ai-web
    runtime: node
    buildCommand: npm install
    startCommand: node vtrade-final-launcher.js
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VTRADE_CORE_URL
        sync: false
      - key: TELEGRAM_BRIDGE_API_KEY
        sync: false

  - type: worker
    name: v-zone-ai-telegram
    runtime: node
    buildCommand: npm install
    startCommand: node vzone-telegram-bot.js
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VTRADE_CORE_URL
        sync: false
      - key: TELEGRAM_BRIDGE_API_KEY
        sync: false
      - key: VZONE_TELEGRAM_POLL_MS
        value: "5000"
