name: V-TRADE MTF dropdown fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install responsive MTF dropdown
        shell: python
        run: |
          from pathlib import Path
          p=Path('premium-dashboard-live.html')
          s=p.read_text(encoding='utf-8')
          if 'vtrade-mtf-dropdown.js' not in s:
              marker='</head>'
              if marker not in s:
                  raise SystemExit('head anchor not found')
              css='''<style id="vtrade-mtf-dropdown-css">\n.vtrade-mtf-selectbar{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#080f1b}.vtrade-mtf-selectbar label{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.vtrade-mtf-selectbar select{min-width:120px;min-height:42px;padding:8px 34px 8px 12px;border:1px solid #29405e;border-radius:10px;background:#09111e;color:#fff;font-weight:900;outline:none}.vtrade-mtf-selectbar select:focus{border-color:#8050ff;box-shadow:0 0 0 2px #8050ff22}.vtrade-mtf-selectbar select option{background:#09111e;color:#fff}@media(max-width:900px){.vtrade-mtf-selectbar{justify-content:stretch;margin-bottom:8px}.vtrade-mtf-selectbar label{min-width:42px}.vtrade-mtf-selectbar select{flex:1;width:100%;min-height:44px}.radar .tf{grid-column:1/-1}}\n</style>\n<script defer src="vtrade-mtf-dropdown.js?v=20260824"></script>\n'''
              s=s.replace(marker,css+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          node --check vtrade-mtf-dropdown.js
          grep -q 'vtrade-mtf-dropdown.js' premium-dashboard-live.html
          grep -q 'vtrade-mtf-selectbar' premium-dashboard-live.html
          echo 'V-TRADE MTF DROPDOWN TEST=PASS'
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-dashboard-live.html vtrade-mtf-dropdown.js .github/workflows/vtrade-mtf-dropdown-fix.yml
          git rm .github/workflows/vtrade-mtf-dropdown-fix.yml
          git commit -m 'fix: add PC and phone MTF timeframe dropdown' || exit 0
          git push
