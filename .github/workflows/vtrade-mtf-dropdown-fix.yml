name: V-TRADE MTF dropdown fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MTF dropdown
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('premium-dashboard-live.html'); s=p.read_text(encoding='utf-8')
          if 'VTRADE_MTF_DROPDOWN_V1' not in s:
            css='''<style id="vtrade-mtf-dropdown-style">.tf-select{min-width:120px;min-height:44px;padding:10px 34px 10px 13px;border:1px solid #8050ff;border-radius:10px;background:#17102e;color:#fff;font-weight:800;outline:none;cursor:pointer}.tf-select option{background:#09111e;color:#fff}@media(max-width:900px){.tf-select{width:100%;min-width:0}}</style><!-- VTRADE_MTF_DROPDOWN_V1 -->'''
            s=s.replace('</head>',css+'</head>',1)
            pat=re.compile(r'<div class="tfs"[^>]*>.*?</div>',re.S)
            repl='<div class="tfs" id="mtfSelector"><select class="tf-select" id="tfSelect" aria-label="Select timeframe"><option value="M5">M5</option><option value="M15" selected>M15</option><option value="H1">H1</option><option value="H4">H4</option><option value="D1">D1</option></select></div>'
            if not pat.search(s): raise SystemExit('MTF selector anchor not found')
            s=pat.sub(repl,s,count=1)
            js='''<script id="vtrade-mtf-dropdown-script">(function(){function boot(){const sel=document.getElementById('tfSelect');if(!sel||sel.dataset.ready==='1')return;sel.dataset.ready='1';sel.addEventListener('change',()=>{const tf=String(sel.value||'M15').toUpperCase();window.vtradeSelectedTF=tf;if(typeof window.showToast==='function')window.showToast(tf+' selected');if(typeof window.latestAnalysis==='object'&&window.latestAnalysis&&typeof window.renderChart==='function')window.renderChart(window.latestAnalysis);});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();</script>'''
            s=s.replace('</body>',js+'</body>',1)
            p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          grep -q 'VTRADE_MTF_DROPDOWN_V1' premium-dashboard-live.html
          grep -q 'id="tfSelect"' premium-dashboard-live.html
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('premium-dashboard-live.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          Path('/tmp/frontend.js').write_text(js,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/frontend.js'],check=True)
          print('V-TRADE MTF DROPDOWN TEST=PASS')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-dashboard-live.html .github/workflows/vtrade-mtf-dropdown-fix.yml
          git rm .github/workflows/vtrade-mtf-dropdown-fix.yml
          git commit -m 'fix: add MTF timeframe dropdown' || exit 0
          git push